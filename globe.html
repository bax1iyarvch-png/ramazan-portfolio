
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Globusss</title>

<link rel="stylesheet"
href="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Widgets/widgets.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body, #cesiumContainer {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020617;
}

.title {
  position: fixed;
  top: 18px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #38bdf8;
  font-size: 23px;
  font-family: Arial;
  z-index: 10;
  pointer-events: none;
  text-shadow: 0 0 15px #008cff;
}

.hint {
  position: fixed;
  bottom: 25px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 13px;
  z-index: 10;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="title">🌍 Globusss</div>

<div id="cesiumContainer"></div>

<div class="hint">
  
</div>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Cesium.js"></script>

<script>
async function startEarth() {

  const viewer = new Cesium.Viewer(
    "cesiumContainer",
    {
      baseLayer: false,
      animation: false,
      timeline: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      baseLayerPicker: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false
    }
  );

  // Satellite Earth
  const satellite =
    await Cesium.ArcGisMapServerImageryProvider.fromUrl(
      "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
    );

  viewer.imageryLayers.addImageryProvider(satellite);

  // City and place names
  const labels =
    await Cesium.ArcGisMapServerImageryProvider.fromUrl(
      "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer"
    );

  viewer.imageryLayers.addImageryProvider(labels);

  // Realistic globe
  viewer.scene.globe.enableLighting = true;
  viewer.scene.globe.showGroundAtmosphere = true;

  // Finger rotation and zoom
  const cameraController =
    viewer.scene.screenSpaceCameraController;

  cameraController.enableRotate = true;
  cameraController.enableZoom = true;
  cameraController.enableTilt = true;
  cameraController.enableLook = true;
  cameraController.minimumZoomDistance = 100;
  cameraController.maximumZoomDistance = 40000000;

  // Start near Uzbekistan
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(
      69.24,
      41.31,
      18000000
    ),
    duration: 3
  });

  window.viewer = viewer;
}

startEarth().catch(error => {
  console.error("Earth loading error:", error);
});
</script>

</body>
</html>
