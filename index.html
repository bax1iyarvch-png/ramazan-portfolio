<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramazan | Portfolio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1426;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;text-align:center;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1}
main{max-width:520px;margin:0 auto;padding:48px 16px 40px}
.tag{font-family:monospace;font-size:12px;color:#22c55e;letter-spacing:1px}
h1{font-size:32px;font-weight:500;line-height:1.2;margin-top:12px;min-height:78px}
.role{color:#38bdf8;font-size:17px;margin-top:6px;min-height:26px}
.cur{display:inline-block;width:2px;height:1em;background:#38bdf8;margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;border:1px solid #1e4a6e;background:rgba(10,30,50,.8);color:#7dd3fc;text-decoration:none;font-size:15px;transition:.15s}
.btn:hover,.btn:active{transform:translateY(-3px) scale(1.03);border-color:#38bdf8;background:rgba(14,50,80,.95)}
.term{margin-top:24px;border-radius:12px;border:1px solid #1e4a6e;background:rgba(3,7,20,.88);overflow:hidden;text-align:left}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(20,26,48,.9)}
.bar i{width:10px;height:10px;border-radius:50%}
.bar span{font-family:monospace;font-size:11px;color:#64748b;margin-left:6px}
pre{font-family:monospace;font-size:13px;line-height:1.7;color:#cbd5e1;padding:14px;min-height:130px;white-space:pre-wrap}
.cmd{color:#22c55e}
h2{color:#38bdf8;font-size:22px;font-weight:500;margin-top:32px}
.stack{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.stack span{padding:8px 16px;border-radius:999px;border:1px solid #1e4a6e;background:rgba(10,30,50,.8);color:#7dd3fc;font-size:14px}
footer{margin-top:36px;font-size:13px;color:#64748b}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <div class="tag">&lt;/&gt; portfolio v1.0</div>
  <h1><span id="t1"></span><span class="cur"></span></h1>
  <div class="role"><span id="t2"></span><span class="cur"></span></div>

  <div class="links">
    <a class="btn" href="https://t.me/bax1iyarovch" target="_blank">Telegram</a>
    <a class="btn" href="lab.html">🌌 3D Lab</a>
    <a class="btn" href="https://github.com/bax1iyarvch-png" target="_blank">GitHub</a>
    <a class="btn" href="mailto:bax1iyarvch@gmail.com">✉️ Contact</a>
  </div>

  <div class="term">
    <div class="bar"><i style="background:#ef4444"></i><i style="background:#eab308"></i><i style="background:#22c55e"></i><span>ramazan@portfolio:~</span></div>
    <pre id="term"></pre>
  </div>

  <h2>Tech Stack</h2>
  <div class="stack">
    <span>HTML5</span><span>CSS3</span><span>JavaScript</span><span>Git</span><span>GitHub Pages</span>
  </div>

  <footer>© 2026 Ramazan</footer>
</main>

<script>
const c=document.getElementById('bg'),x=c.getContext('2d');
let w,h,p=[],m={x:-999,y:-999};
function r(){w=c.width=innerWidth;h=c.height=innerHeight}
r();addEventListener('resize',r);
addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
addEventListener('pointerleave',()=>{m.x=-999;m.y=-999});
for(let i=0;i<70;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6});
(function a(){
x.clearRect(0,0,w,h);
p.forEach((s,i)=>{
s.x+=s.vx;s.y+=s.vy;
if(s.x<0||s.x>w)s.vx*=-1;
if(s.y<0||s.y>h)s.vy*=-1;
x.fillStyle='#38bdf8';x.fillRect(s.x,s.y,2,2);
for(let j=i+1;j<p.length;j++){
const q=p[j],d=Math.hypot(s.x-q.x,s.y-q.y);
if(d<110){x.strokeStyle='rgba(56,189,248,'+(1-d/110)*.8+')';x.beginPath();x.moveTo(s.x,s.y);x.lineTo(q.x,q.y);x.stroke()}
}
const dm=Math.hypot(s.x-m.x,s.y-m.y);
if(dm<150){x.strokeStyle='rgba(56,189,248,'+(1-dm/150)+')';x.beginPath();x.moveTo(s.x,s.y);x.lineTo(m.x,m.y);x.stroke()}
});
requestAnimationFrame(a)})();

const sl=ms=>new Promise(r=>setTimeout(r,ms));
async function type(el,s,sp){for(const ch of s){el.textContent+=ch;await sl(sp)}}
async function head(){await type(document.getElementById('t1'),"Hello, I'm Ramazan!",60)}
async function roles(){
const t=document.getElementById('t2'),L=['Future Web Developer','Creative Coder','3D Explorer'];
await sl(1500);let i=0;
while(true){
await type(t,L[i],55);await sl(1400);
while(t.textContent.length){t.textContent=t.textContent.slice(0,-1);await sl(25)}
await sl(250);i=(i+1)%L.length}}
async function term(){
const t=document.getElementById('term');
const S=[['$ whoami','> Ramazan, aspiring web dev'],['$ ls skills/','> HTML5  CSS3  Git  JS'],['$ echo $GOAL','> become a pro developer']];
await sl(2200);
while(true){
t.textContent='';
for(const [cmd,out] of S){
const sp=document.createElement('span');sp.className='cmd';t.appendChild(sp);
await type(sp,cmd,45);await sl(300);
t.appendChild(document.createTextNode('\n'+out+'\n'));await sl(700)}
await sl(3000)}}
head();roles();term();
</script>
</body>
</html>
